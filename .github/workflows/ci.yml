name: CI for OrderProcessing

on:
  push:
    branches: [ main, development, feature/*, new_implementation ]
  pull_request:
    branches: [ main, development, new_implementation ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore OrderProcessing.sln

    - name: Build
      run: dotnet build OrderProcessing.sln --no-restore --configuration Release

    - name: Run tests
      run: dotnet test OrderProcessing.sln --no-build --configuration Release --verbosity normal
